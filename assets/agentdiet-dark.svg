<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"
     aria-label="AgentDiet: measures the always-on context an AI coding agent loads. In a simulated repository, always-on tokens drop from 6,770 at grade C to 711 at grade A, an 89.5 percent reduction.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff0d" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,monospace; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .dot, rect[style] { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#0a0b0d"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity=".75"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff1f"/>

  <!-- mark: three instruction lines, the fat trimmed -->
  <g transform="translate(56,52)">
    <rect width="26" height="3.6" rx="1.8" fill="#f4f5f7"/>
    <rect y="7.4" width="17" height="3.6" rx="1.8" fill="#f4f5f7" opacity=".45"/>
    <rect y="14.8" width="9" height="3.6" rx="1.8" fill="#3ddc97"/>
  </g>
  <text x="56" y="122" font-size="42" font-weight="600" letter-spacing="-1.6" fill="#f4f5f7">AgentDiet</text>

  <text x="56" y="162" font-size="17" fill="#969ca5">Measure the context your AI coding agent loads</text>
  <text x="56" y="186" font-size="17" fill="#969ca5">before you type a single word — then cut it.</text>

  <text x="56" y="228" font-size="12.5" fill="#7d848e" class="mono">go install github.com/qansaid/agentdiet@latest</text>

  <g class="mono">
    <circle cx="60" cy="256" r="3" fill="#3ddc97" class="dot"/>
    <text x="72" y="260" font-size="11" fill="#7d848e">MIT · Go 1.22+ · single static binary · no account · no network calls</text>
  </g>

  <!-- report card -->
  <rect x="644" y="40" width="512" height="220" rx="14" fill="#101216" stroke="#ffffff1f"/>
  <text x="672" y="74" font-size="11" fill="#7d848e" class="mono" letter-spacing=".6">AGENT CONTEXT · ACME-PLATFORM</text>
  <rect x="1054" y="59" width="74" height="21" rx="5" fill="#ff8a4c" fill-opacity=".12" stroke="#ff8a4c" stroke-opacity=".45"/>
  <text x="1067" y="74" font-size="10.5" fill="#ff8a4c" class="mono">C → A</text>

  <text x="672" y="112" font-size="10.5" fill="#7d848e" class="mono">BEFORE</text>
  <text x="1128" y="114" font-size="17" fill="#f4f5f7" class="mono" text-anchor="end">6,770</text>
  
    <rect x="672" y="124" width="456" height="8" rx="4.0" fill="#ffffff12"/>
    <rect x="672" y="124" width="456" height="8" rx="4.0" fill="#ff8a4c"
          style="transform-origin:672px 124px;animation:grow .9s cubic-bezier(.22,1,.36,1) 0.1s both"/>

  <text x="672" y="168" font-size="10.5" fill="#7d848e" class="mono">AFTER</text>
  <text x="1128" y="170" font-size="17" fill="#3ddc97" class="mono" text-anchor="end">711</text>
  
    <rect x="672" y="180" width="47.9" height="8" rx="4.0" fill="#ffffff12"/>
    <rect x="672" y="180" width="47.9" height="8" rx="4.0" fill="#3ddc97"
          style="transform-origin:672px 180px;animation:grow .9s cubic-bezier(.22,1,.36,1) 0.35s both"/>
  <line x1="725.9" y1="184" x2="1128" y2="184"
        stroke="#ffffff12" stroke-width="1" stroke-dasharray="2 5"/>

  <text x="672" y="216" font-size="13" fill="#3ddc97" class="mono">−89.5% always-on tokens</text>
  <text x="672" y="240" font-size="11" fill="#7d848e" class="mono">simulated repository · real report output</text>
</svg>
