<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img"
     aria-label="AgentDiet: always-on agent context in a simulated repository drops from 6,770 tokens at grade C to 711 tokens at grade A, an 89.5 percent reduction.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff0d" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,monospace; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .dot, rect[style] { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="880" height="300" rx="16" fill="#0a0b0d"/>
  <rect width="880" height="300" rx="16" fill="url(#grid)" opacity=".7"/>
  <rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="none" stroke="#ffffff1f"/>

  <!-- mark: three instruction lines, the fat trimmed -->
  <g transform="translate(40,42)">
    <rect width="24" height="3.4" rx="1.7" fill="#f4f5f7"/>
    <rect y="7" width="16" height="3.4" rx="1.7" fill="#f4f5f7" opacity=".45"/>
    <rect y="14" width="8.5" height="3.4" rx="1.7" fill="#3ddc97"/>
  </g>
  <text x="40" y="112" font-size="34" font-weight="600" letter-spacing="-1.2" fill="#f4f5f7">AgentDiet</text>

  <text x="40" y="148" font-size="14.5" fill="#969ca5">Measure the context your AI coding agent loads</text>
  <text x="40" y="170" font-size="14.5" fill="#969ca5">before you type a single word, then cut it.</text>

  <text x="40" y="212" font-size="11.5" fill="#7d848e" class="mono">go install github.com/qansaid/agentdiet@latest</text>

  <g class="mono">
    <circle cx="43" cy="238" r="3" fill="#3ddc97" class="dot"/>
    <text x="54" y="242" font-size="10.5" fill="#7d848e">MIT · Go 1.22+ · static binary · no account</text>
  </g>

  <!-- report card -->
  <rect x="496" y="34" width="344" height="232" rx="12" fill="#101216" stroke="#ffffff1f"/>
  <text x="520" y="66" font-size="9.5" fill="#7d848e" class="mono" letter-spacing=".5">AGENT CONTEXT · ACME</text>
  <rect x="754" y="52" width="62" height="19" rx="4"
        fill="#ff8a4c" fill-opacity=".12" stroke="#ff8a4c" stroke-opacity=".45"/>
  <text x="765" y="65" font-size="9.5" fill="#ff8a4c" class="mono">C → A</text>

  <text x="520" y="104" font-size="9.5" fill="#7d848e" class="mono">BEFORE</text>
  <text x="816" y="106" font-size="15" fill="#f4f5f7" class="mono" text-anchor="end">6,770</text>
  <rect x="520" y="116" width="296" height="7" rx="3.5" fill="#ffffff12"/><rect x="520" y="116" width="296" height="7" rx="3.5" fill="#ff8a4c" style="transform-origin:520px 116px;animation:grow .9s cubic-bezier(.22,1,.36,1) 0.1s both"/>

  <text x="520" y="158" font-size="9.5" fill="#7d848e" class="mono">AFTER</text>
  <text x="816" y="160" font-size="15" fill="#3ddc97" class="mono" text-anchor="end">711</text>
  <rect x="520" y="170" width="31.1" height="7" rx="3.5" fill="#ffffff12"/><rect x="520" y="170" width="31.1" height="7" rx="3.5" fill="#3ddc97" style="transform-origin:520px 170px;animation:grow .9s cubic-bezier(.22,1,.36,1) 0.35s both"/>
  <line x1="557.1" y1="173.5" x2="816" y2="173.5"
        stroke="#ffffff12" stroke-width="1" stroke-dasharray="2 5"/>

  <text x="520" y="208" font-size="12" fill="#3ddc97" class="mono">−89.5% always-on tokens</text>
  <text x="520" y="234" font-size="9.5" fill="#7d848e" class="mono">simulated repo · real report output</text>
</svg>
